<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Pague Menos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#001A80">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Precinho">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
  <script>
    (function() {
      if (typeof window !== 'undefined') {
        if (!window.crypto) {
          window.crypto = {};
        }
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function() {
            if (window.crypto.getRandomValues) {
              return ('10000000-1000-4000-8000-100000000000').replace(/[018]/g, function(c) {
                return (+c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (+c / 4)))).toString(16);
              });
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          };
        }
        // Register PWA Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                console.log('[PWA] Service Worker registrado:', reg.scope);
              })
              .catch(function(err) {
                console.warn('[PWA] Falha ao registrar Service Worker:', err);
              });
          });
        }
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- Mahoraga Accessibility Widget: Acessibilidade Digital Completa & Tradutor de Libras (REA) -->
  <link rel="stylesheet" href="/assets/mahoraga/mahoraga-widget.css" data-beasties-skip />
  <script src="/assets/mahoraga/mahoraga-widget.umd.js" defer></script>
  <script>
    (function() {
      if (typeof window === 'undefined') return;
      function initMahoraga() {
        var WidgetClass = window.Mahoraga || window.HT;
        if (typeof WidgetClass === 'function') {
          try {
            window.mahoraga = new WidgetClass({
              token: 'precinho-pague-menos',
              avatar: 'THIAGO',
              align: 'center',
              side: 'right',
              highContrast: false,
              opacity: 100
            });
            console.log('[Mahoraga] Widget de acessibilidade inicializado com sucesso.');
          } catch (e) {
            console.error('[Mahoraga] Erro ao instanciar widget:', e);
          }
        } else {
          setTimeout(initMahoraga, 150);
        }
      }
      if (document.readyState === 'complete') {
        initMahoraga();
      } else {
        window.addEventListener('load', initMahoraga);
      }
    })();
  </script>
</body>
</html>
